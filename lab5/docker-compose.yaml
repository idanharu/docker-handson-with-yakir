services:
  db:
    image: mysql:latest
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SecretPassw0rd
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  app:
    image: node_mysql:v0.1
    container_name: mysql_node
    ports:
      - "3000:3000"
volumes:
  db_data:
